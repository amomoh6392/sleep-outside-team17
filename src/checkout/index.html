<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/CheckoutProcess.mjs"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <section class="grid">
          <div class="order-summary">
            <div>
              <span>SubTotal:</span>
              <span id="subTotal"></span>
            </div>
            <div>
              <span>Tax:</span>
              <span id="tax"></span>
            </div>
            <div>
              <span>Shipping Estimate:</span>
              <span id="shippingFee"></span>
            </div>
            <div>
              <span>Order Total:</span>
              <span id="total"></span>
            </div>
          </div>

          <form action="" name="checkout" id="checkout">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input
                type="text"
                id="fname"
                name="fname"
                required
                autocomplete="fname"
              />
            </div>
            <div class="form-group">
              <label for="lname">Last Name</label>
              <input
                type="text"
                id="lname"
                name="lname"
                required
                autocomplete="lname"
              />
            </div>
            <div class="form-group">
              <label for="street">Street Address</label>
              <input type="text" name="street" id="street" required />
            </div>
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" name="city" id="city" required />
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" name="state" id="state" required />
            </div>
            <div class="form-group">
              <label for="zip">Zip Code</label>
              <input type="text" name="zip" id="zip" required />
            </div>
            <div class="form-group">
              <label for="cardNumber">Credit Card Number</label>
              <input type="text" name="cardNumber" id="cardNumber" required />
            </div>
            <div class="form-group">
              <label for="expiration">Expiration Date</label>
              <input type="text" name="expiration" id="expiration" required />
            </div>
            <div class="form-group">
              <label for="code">Security Code</label>
              <input type="text" name="code" id="code" required />
            </div>
            <button type="submit">Checkout</button>
          </form>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
